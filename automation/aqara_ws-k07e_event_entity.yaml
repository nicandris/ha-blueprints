blueprint:
  name: Aqara H2 EU Single rocker (WS-K07E)
  description: >-
    Runs an action per button event of a Zigbee2MQTT Aqara H2 single rocker.
    Only the top button can toggle the relay. In `control_relay` mode the
    `single_*` events still fire alongside the relay toggle; in `decoupled` mode the relay stays put.
    `double_*`, `hold_*` and `release_*` need `Multi click` enabled for that
    button, which adds ~1 s of delay while the switch waits for more presses;
    `release_*` only ever follows a `hold_*`. Switches without a neutral wire
    report events more slowly.
    Zigbee2MQTT also exposes `double_*`, `hold_*` and `release_*` for the top
    button(s); whether the switch sends them depends on its mode and firmware.
    Duplicate events (Zigbee retries) within the cooldown are dropped; lower the
    cooldown if quick repeated presses get lost.
    Cloned from Jonybat's gist https://gist.github.com/Jonybat/f93cbff0be1733f37e5ac5b95f8c10c7,
    modernised and without the helper entities.
  author: nicandris (based on Jonybat's gist)
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/nicandris/ha-blueprints/blob/main/automation/aqara_ws-k07e_event_entity.yaml
  input:
    event:
      name: Event
      description: Zigbee2MQTT action event entity of the switch.
      selector:
        entity:
          integration: mqtt
          domain: event
    cooldown_seconds:
      name: Cooldown (seconds)
      description: The same event again within this time is treated as a duplicate.
      default: 0.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: seconds
    run_mode:
      name: Run mode
      description: >-
        `parallel` lets each press run on its own. `restart` makes every new press
        cancel the running action (the old behaviour), e.g. so a release stops a
        hold loop.
      default: parallel
      selector:
        select:
          options: [parallel, restart]
    buttons:
      name: Buttons
      input:
        single_up:
          name: Single Up
          default: []
          selector: { action: {} }
        double_up:
          name: Double Up
          default: []
          selector: { action: {} }
        hold_up:
          name: Hold Up
          default: []
          selector: { action: {} }
        release_up:
          name: Release Up
          default: []
          selector: { action: {} }
        single_down:
          name: Single Down
          default: []
          selector: { action: {} }
        double_down:
          name: Double Down
          default: []
          selector: { action: {} }
        hold_down:
          name: Hold Down
          default: []
          selector: { action: {} }
        release_down:
          name: Release Down
          default: []
          selector: { action: {} }

mode: !input run_mode
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input event
    not_from:
      - unavailable
    not_to:
      - unknown
      - unavailable

# The event entity's state is the event time and its previous state still holds
# the previous event, so duplicates are caught without helper entities. Checked as
# a condition so a duplicate never starts (or cancels) a run.
variables:
  cooldown: !input cooldown_seconds
  command: "{{ trigger.to_state.attributes.event_type }}"

conditions:
  - condition: template
    alias: Not a duplicate of the previous event
    value_template: >-
      {{ trigger.from_state is not none
         and (command != trigger.from_state.attributes.event_type
              or as_timestamp(trigger.to_state.state, 0) - as_timestamp(trigger.from_state.state, 0) > cooldown) }}

actions:
  - choose:
      - conditions: "{{ command == 'single_up' }}"
        sequence: !input single_up
      - conditions: "{{ command == 'double_up' }}"
        sequence: !input double_up
      - conditions: "{{ command == 'hold_up' }}"
        sequence: !input hold_up
      - conditions: "{{ command == 'release_up' }}"
        sequence: !input release_up
      - conditions: "{{ command == 'single_down' }}"
        sequence: !input single_down
      - conditions: "{{ command == 'double_down' }}"
        sequence: !input double_down
      - conditions: "{{ command == 'hold_down' }}"
        sequence: !input hold_down
      - conditions: "{{ command == 'release_down' }}"
        sequence: !input release_down
