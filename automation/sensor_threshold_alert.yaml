blueprint:
  name: Sensor threshold alert
  description: >-
    Alerts when any of a set of sensors stays above (or below) its threshold for a
    while — too cold, too warm, too humid, CO2 too high. One shared threshold with
    optional per-sensor overrides, each sensor timed independently. Runs your alert
    action, then optionally speaks it on a speaker inside a time window, with an
    optional AI-written line (skipped when no AI Task integration is set up).
    Actions get `sensor`, `value`, `threshold`, `room` (the sensor's area name)
    and `unit`. Every 15 minutes, outside the cooldown and when "Only if" holds,
    sensors still past their threshold alert too, so an alert skipped by the
    cooldown, the conditions or a restart is sent later, and an ongoing problem
    repeats once per cooldown. That check can't see how long a sensor has been
    past its threshold, so one that crossed just before it may alert before
    "For at least" is up.
  domain: automation
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/nicandris/ha-blueprints/blob/main/automation/sensor_threshold_alert.yaml
  input:
    detection:
      name: Detection
      input:
        sensors:
          name: Sensors
          selector:
            entity:
              domain: sensor
              multiple: true
        direction:
          name: Alert when
          default: above
          selector:
            select:
              options:
              - {label: Above the threshold, value: above}
              - {label: Below the threshold, value: below}
        threshold:
          name: Threshold
          selector:
            number: {min: -50, max: 5000, step: 0.1, mode: box}
        overrides:
          name: Per-sensor thresholds
          description: >-
            Optional, e.g. `sensor.bedroom_temperature: 19`. Anything other than
            a mapping is ignored (with a warning in the log).
          default: {}
          selector:
            object: {}
        duration:
          name: For at least
          default: {hours: 0, minutes: 15, seconds: 0}
          selector:
            duration: {}
        cooldown:
          name: Don't repeat within
          description: >-
            After an alert, stay quiet this long. Applies to the whole automation,
            not per sensor — a second room alerting inside the window is skipped.
          default: {hours: 5, minutes: 0, seconds: 0}
          selector:
            duration: {}
        conditions:
          name: Only if
          description: Optional extra conditions, e.g. a mode switch being off.
          default: []
          selector:
            condition: {}
    alerting:
      name: Alert
      input:
        alert:
          name: Alert action
          description: E.g. a notify call using `{{ room }}` and `{{ value }}`.
          default: []
          selector:
            action: {}
    announce:
      name: Spoken announcement
      collapsed: true
      input:
        tts_entity:
          name: TTS engine
          description: Leave empty to skip the announcement.
          default: ''
          selector:
            entity:
              domain: tts
        speaker:
          name: Speaker
          description: A Music Assistant player. Announces with its chime and announcement volume.
          default: ''
          selector:
            entity:
              domain: media_player
              integration: music_assistant
        announce_after:
          name: Speak only after
          default: '10:00:00'
          selector:
            time: {}
        announce_before:
          name: Speak only before
          description: '`00:00:00` means until midnight.'
          default: '00:00:00'
          selector:
            time: {}
        ai_prompt:
          name: AI prompt
          description: >-
            Optional. Instructions for ai_task.generate_data; templates such as
            `{{ room }}` and `{{ value }}` work. Empty speaks the fallback directly.
          default: ''
          selector:
            text:
              multiline: true
        fallback:
          name: Fallback message
          description: Spoken when there is no AI prompt or the AI call fails.
          default: '{{ room }} is at {{ value }}{{ unit }}.'
          selector:
            text: {}

trigger_variables:
  direction: !input direction
  shared_threshold: !input threshold
  overrides: !input overrides
  cooldown: !input cooldown

triggers:
- trigger: numeric_state
  id: crossed
  entity_id: !input sensors
  # Positive while the sensor is past its own threshold, in either direction.
  value_template: >-
    {% if is_number(state.state) %}
    {% set limits = overrides if overrides is mapping else {} %}
    {% set t = limits.get(state.entity_id, shared_threshold) | float(shared_threshold) %}
    {{ (state.state | float - t) if direction == 'above' else (t - state.state | float) }}
    {% else %}0{% endif %}
  above: 0
  for: !input duration
# Re-check sensors still past their threshold; the cooldown and "Only if"
# conditions below gate it like any other alert.
- trigger: time_pattern
  id: recheck
  minutes: /15

variables:
  sensors: !input sensors
  limits: '{{ overrides if overrides is mapping else {} }}'
  past: >-
    {%- set ns = namespace(found=[]) %}
    {%- for s in sensors if is_number(states(s)) %}
      {%- set t = limits.get(s, shared_threshold) | float(shared_threshold) %}
      {%- set v = states(s) | float %}
      {%- if (v > t if direction == 'above' else v < t) %}{% set ns.found = ns.found + [s] %}{% endif %}
    {%- endfor %}
    {{- ns.found }}
  targets: "{{ [trigger.entity_id] if trigger.id == 'crossed' else past }}"

conditions:
- condition: template
  alias: Outside the cooldown since the last alert
  value_template: >-
    {{ as_timestamp(now()) - as_timestamp(this.attributes.last_triggered, 0)
       >= timedelta(**cooldown).total_seconds() }}
- condition: template
  alias: A sensor to alert on
  value_template: '{{ targets | count > 0 }}'
- condition: and
  conditions: !input conditions

actions:
- if:
  - condition: template
    value_template: '{{ overrides is not mapping }}'
  then:
  - action: system_log.write
    data:
      level: warning
      logger: blueprints.sensor_threshold_alert
      message: '{{ this.entity_id }}: per-sensor thresholds must be a mapping, ignored.'
- variables:
    tts_entity: !input tts_entity
    speaker: !input speaker
- repeat:
    for_each: '{{ targets }}'
    sequence:
    - variables:
        sensor: '{{ repeat.item }}'
        value: '{{ states(sensor, rounded=True) }}'
        threshold: '{{ limits.get(sensor, shared_threshold) }}'
        room: '{{ area_name(sensor) or state_attr(sensor, ''friendly_name'') }}'
        unit: '{{ state_attr(sensor, ''unit_of_measurement'') or '''' }}'
        generated: {}
    - variables:
        ai_prompt: !input ai_prompt
        fallback: !input fallback
    - sequence: !input alert
    - if:
      - condition: template
        value_template: '{{ tts_entity != '''' and speaker != '''' }}'
      - condition: time
        after: !input announce_after
        before: !input announce_before
      then:
      - if:
        - condition: template
          value_template: "{{ ai_prompt != '' and states.ai_task | list | count > 0 }}"
          alias: AI prompt set and an AI Task entity exists (else the action is missing)
        then:
        - action: ai_task.generate_data
          data:
            task_name: Sensor threshold alert
            instructions: '{{ ai_prompt }}'
          response_variable: generated
          continue_on_error: true
      - variables:
          # Only a short spoken line is used; anything else falls back.
          line: >-
            {%- set t = (generated.data if generated.data is defined and generated.data else '') | string | trim %}
            {{- t if 10 <= t | length <= 300 else fallback }}
      - action: music_assistant.play_announcement
        target:
          entity_id: '{{ speaker }}'
        data:
          message: '{{ line }}'
          tts_entity_id: '{{ tts_entity }}'

mode: queued
max: 10
