blueprint:
  name: Aqara H2 EU Double rocker (WS-K08E)
  description:
    "
    Only top buttons can toggle the relays, and double/hold/release actions can only be enabled for the bottom buttons.\n
    \n
    In `control_relay` mode, `single_*` events are always sent, alongside with actual relay toggle. In `decoupled` mode, the same events are sent, but the relay toggle is disabled.\n
    \n
    When `Multi click` is disabled, only `single_*` events are sent. To have access to `double_*`, `hold_*` and `release_*` events, `Multi click` must be enabled, for the respective button.\n
    Also, `release_*` only and always follows `hold_*` events. If button is not held enough to trigger `hold_*`, there will also not be a `release_*` event.\n
    \n
    Enabling `Multi click` will add ~1s of additional delay to event triggering, as the switch waits for further button presses.\n
    Switches connected without neutral wire also have slower event triggering, compared to switches with neutral wire connected.\n
    \n
    Cloned from Jonybat's gist https://gist.github.com/Jonybat/729e534537fa8903b1269ef722ca2999, modernised to current trigger/action syntax.\n
    "
  author: Jonybat
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    event:
      name: Event
      description: Zigbee2MQTT controller event
      selector:
        entity:
          integration: mqtt
          domain: event

    helper_last_controller_event:
      name: Helper - Last Controller Event
      description: Input Text Helper to store the last event
      selector:
        entity:
          domain: input_text

    helper_last_event_time:
      name: Helper - Last Event Timestamp
      description: Input Text Helper to store the last timestamp
      selector:
        entity:
          domain: input_text

    cooldown_seconds:
      name: Cooldown (seconds)
      description: Minimum time before accepting duplicate events
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: seconds

    single_left:
      name: Single Left Up
      default: []
      selector: { action: {} }
# Hopefully these will be supported in future firmware
#    double_left:
#      name: Double Left
#      default: []
#      selector: { action: {} }
#    hold_left:
#      name: Hold Left
#      default: []
#      selector: { action: {} }
#    release_left:
#      name: Release Left
#      default: []
#      selector: { action: {} }
    single_left_down:
      name: Single Left Down
      default: []
      selector: { action: {} }
    double_left_down:
      name: Double Left Down
      default: []
      selector: { action: {} }
    hold_left_down:
      name: Hold Left Down
      default: []
      selector: { action: {} }
    release_left_down:
      name: Release Left Down
      default: []
      selector: { action: {} }

    single_right:
      name: Single Right Up
      default: []
      selector: { action: {} }
# Hopefully these will be supported in future firmware
#    double_right:
#      name: Double Right
#      default: []
#      selector: { action: {} }
#    hold_right:
#      name: Hold Right
#      default: []
#      selector: { action: {} }
#    release_right:
#      name: Release Right
#      default: []
#      selector: { action: {} }
    single_right_down:
      name: Single Right Down
      default: []
      selector: { action: {} }
    double_right_down:
      name: Double Right Down
      default: []
      selector: { action: {} }
    hold_right_down:
      name: Hold Right Down
      default: []
      selector: { action: {} }
    release_right_down:
      name: Release Right Down
      default: []
      selector: { action: {} }

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input event
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable

actions:
  - variables:
      helper_last_controller_event: !input helper_last_controller_event
      helper_last_event_time: !input helper_last_event_time
      cooldown: !input cooldown_seconds
      command: "{{ trigger.to_state.attributes.event_type }}"
      prev_command: "{{ states(helper_last_controller_event) }}"
      prev_time: "{{ states(helper_last_event_time) | float(0) }}"
      now_time: "{{ now().timestamp() }}"
      elapsed: "{{ now_time - prev_time }}"

  - condition: or
    conditions:
      - condition: template
        value_template: "{{ command != prev_command }}"
      - condition: template
        value_template: "{{ elapsed > cooldown }}"

  - action: input_text.set_value
    data:
      entity_id: !input helper_last_controller_event
      value: "{{ command }}"

  - action: input_text.set_value
    data:
      entity_id: !input helper_last_event_time
      value: "{{ '%.6f' | format(now_time) }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ command == 'single_left' }}"
        sequence: !input single_left
# Hopefully these will be supported in future firmware
#      - conditions:
#          - condition: template
#            value_template: "{{ command == 'double_left' }}"
#        sequence: !input double_left
#      - conditions:
#          - condition: template
#            value_template: "{{ command == 'hold_left' }}"
#        sequence: !input hold_left
#      - conditions:
#          - condition: template
#            value_template: "{{ command == 'release_left' }}"
#        sequence: !input release_left
      - conditions:
          - condition: template
            value_template: "{{ command == 'single_left_down' }}"
        sequence: !input single_left_down
      - conditions:
          - condition: template
            value_template: "{{ command == 'double_left_down' }}"
        sequence: !input double_left_down
      - conditions:
          - condition: template
            value_template: "{{ command == 'hold_left_down' }}"
        sequence: !input hold_left_down
      - conditions:
          - condition: template
            value_template: "{{ command == 'release_left_down' }}"
        sequence: !input release_left_down

      - conditions:
          - condition: template
            value_template: "{{ command == 'single_right' }}"
        sequence: !input single_right
# Hopefully these will be supported in future firmware
#      - conditions:
#          - condition: template
#            value_template: "{{ command == 'double_right' }}"
#        sequence: !input double_right
#      - conditions:
#          - condition: template
#            value_template: "{{ command == 'hold_right' }}"
#        sequence: !input hold_right
#      - conditions:
#          - condition: template
#            value_template: "{{ command == 'release_right' }}"
#        sequence: !input release_right
      - conditions:
          - condition: template
            value_template: "{{ command == 'single_right_down' }}"
        sequence: !input single_right_down
      - conditions:
          - condition: template
            value_template: "{{ command == 'double_right_down' }}"
        sequence: !input double_right_down
      - conditions:
          - condition: template
            value_template: "{{ command == 'hold_right_down' }}"
        sequence: !input hold_right_down
      - conditions:
          - condition: template
            value_template: "{{ command == 'release_right_down' }}"
        sequence: !input release_right_down
