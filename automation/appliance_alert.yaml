blueprint:
  name: Appliance alert
  description: >-
    Alerts while an entity sits in a problem state — dehumidifier bucket full,
    dishwasher salt low, filter dirty — and clears the alert when it leaves it.
    Pins a persistent notification (re-pinned after an HA restart or when the
    entity comes back in a problem state), runs your alert action, optionally
    speaks the message inside a time window, and can have an AI write the line
    (sanity-checked, with a fallback; skipped when no AI Task integration is set
    up). Actions get `title`, `message` and `tag`. A blip to unavailable or a move
    between two problem states does not alert again; a problem that starts while
    the entity is unavailable alerts once it reports in. The clear action runs
    when the entity leaves a problem state for a healthy one; coming back healthy
    from unavailable only dismisses the persistent notification.
  domain: automation
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/nicandris/ha-blueprints/blob/main/automation/appliance_alert.yaml
  input:
    detection:
      name: Detection
      input:
        entity:
          name: Entity
          selector:
            entity: {}
        problem_states:
          name: Problem states
          description: States that raise the alert, e.g. `on`, or `empty` and `nearly_empty`.
          selector:
            select:
              options: ['on']
              multiple: true
              custom_value: true
        duration:
          name: For at least
          default: {hours: 0, minutes: 0, seconds: 30}
          selector:
            duration: {}
    message:
      name: Message
      input:
        tag:
          name: Notification id
          description: Used for the persistent notification and passed to actions as `tag`.
          selector:
            text: {}
        title:
          name: Title
          selector:
            text: {}
        fallback:
          name: Message
          description: Used as is, or when the AI line is missing or fails the check.
          selector:
            text: {}
        ai_prompt:
          name: AI prompt
          description: Optional. Instructions for ai_task.generate_data.
          default: ''
          selector:
            text:
              multiline: true
        ai_must_contain:
          name: AI line must contain
          description: Optional words the AI line must include, or the fallback is used.
          default: []
          selector:
            select:
              options: []
              multiple: true
              custom_value: true
    actions_group:
      name: Actions
      input:
        alert:
          name: Alert action
          description: E.g. a phone notification using `{{ title }}`, `{{ message }}`, `{{ tag }}`.
          default: []
          selector:
            action: {}
        clear:
          name: Clear action
          description: Runs when the problem state ends, e.g. clear the phone notification by `{{ tag }}`.
          default: []
          selector:
            action: {}
    announce:
      name: Spoken announcement
      collapsed: true
      input:
        tts_entity:
          name: TTS engine
          description: Leave empty to skip the announcement.
          default: ''
          selector:
            entity:
              domain: tts
        speaker:
          name: Speaker
          description: A Music Assistant player. Announces with its chime and announcement volume.
          default: ''
          selector:
            entity:
              domain: media_player
              integration: music_assistant
        announce_after:
          name: Speak only after
          default: '10:00:00'
          selector:
            time: {}
        announce_before:
          name: Speak only before
          description: '`00:00:00` means until midnight.'
          default: '00:00:00'
          selector:
            time: {}

trigger_variables:
  entity: !input entity
  problem_states: !input problem_states
  ps: '{{ [problem_states] if problem_states is string else problem_states | list }}'

triggers:
# Also true while unavailable/unknown, so a blip in the middle of a problem, or a
# move from one problem state to another, does not fire it again.
- trigger: template
  value_template: "{{ states(entity) in ps + ['unavailable', 'unknown'] }}"
  for: !input duration
  id: problem
- trigger: state
  entity_id: !input entity
  not_to: [unavailable, unknown]
  id: cleared
- trigger: homeassistant
  event: start
  id: restart
- trigger: state
  entity_id: !input entity
  from: [unavailable, unknown]
  to: !input problem_states
  id: restart

variables:
  tag: !input tag
  title: !input title
  fallback: !input fallback
  ai_prompt: !input ai_prompt
  ai_must_contain: !input ai_must_contain
  tts_entity: !input tts_entity
  speaker: !input speaker

actions:
- choose:
  - conditions:
    - condition: trigger
      id: cleared
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none and trigger.to_state.state not in ps
           and trigger.from_state.state in ps + ['unavailable', 'unknown'] }}
      alias: Moved to a healthy state from a problem (or unavailable) state
    sequence:
    - action: persistent_notification.dismiss
      data:
        notification_id: '{{ tag }}'
    - if:
      - condition: template
        value_template: '{{ trigger.from_state.state in ps }}'
        alias: Left a problem state (not just unavailable)
      then:
      - sequence: !input clear
  - conditions:
    - condition: trigger
      id: restart
    - condition: template
      value_template: "{{ trigger.platform != 'state' or (this.attributes.current | default(0)) == 0 }}"
      alias: Not while an alert run is waiting for the entity
    alias: Re-pin after a restart or outage — persistent notifications live only in memory
    sequence:
    - wait_template: "{{ states(entity) not in ['unavailable', 'unknown'] }}"
      timeout: 120
    - condition: template
      value_template: '{{ states(entity) in ps }}'
    - action: persistent_notification.create
      data:
        notification_id: '{{ tag }}'
        title: '{{ title }}'
        message: '{{ fallback }}'
  - conditions:
    - condition: trigger
      id: problem
    sequence:
    # Fired while unavailable means the problem began from a healthy state during
    # an outage: wait for the entity to report in, then alert if it's a problem.
    - wait_template: "{{ states(entity) not in ['unavailable', 'unknown'] }}"
      timeout: '24:00:00'
      continue_on_timeout: false
    - condition: template
      value_template: '{{ states(entity) in ps }}'
      alias: In a problem state, not just unavailable
    - if:
      - condition: template
        value_template: "{{ ai_prompt != '' and states.ai_task | list | count > 0 }}"
        alias: AI prompt set and an AI Task entity exists (else the action is missing)
      then:
      - action: ai_task.generate_data
        data:
          task_name: '{{ title }}'
          instructions: '{{ ai_prompt }}'
        response_variable: generated
        continue_on_error: true
    - variables:
        # The model sometimes rambles or answers the wrong thing; only a short line
        # that mentions every required word is used.
        message: >-
          {%- set t = (generated.data if generated is defined and generated.data else '') | string | trim %}
          {%- set missing = ai_must_contain | map('lower') | reject('in', t | lower) | list %}
          {%- set ok = 20 <= t | length <= 200 and missing | length == 0 %}
          {{- t if ok else fallback }}
    - action: persistent_notification.create
      data:
        notification_id: '{{ tag }}'
        title: '{{ title }}'
        message: '{{ message }}'
    - sequence: !input alert
    - if:
      - condition: template
        value_template: '{{ tts_entity != '''' and speaker != '''' }}'
      - condition: time
        after: !input announce_after
        before: !input announce_before
      then:
      - action: music_assistant.play_announcement
        target:
          entity_id: '{{ speaker }}'
        data:
          message: '{{ message }}'
          tts_entity_id: '{{ tts_entity }}'

mode: queued
max: 5
