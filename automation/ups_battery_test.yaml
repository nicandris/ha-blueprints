blueprint:
  name: UPS battery test
  description: >-
    Cuts mains to a UPS via a smart plug for a few minutes to prove it still carries
    its load, then restores. Runs on the first chosen weekday of the month, with a
    heads-up the day before and again before the test. "Run actions" starts a test
    on demand — that skips the date gate, not the safety checks. Skips the test
    unless the plug is on and the UPS is on mains. Aborts if the UPS never goes on
    battery (wrong plug), the battery drops to the floor or its reading is lost;
    restores mains on HA start, on automation reload (which kills a running test)
    and if the plug is left off too long, retrying the switch-on. Every outcome
    lands as a persistent notification and is passed to the optional notify
    action as `title`, `message` and `important`.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/nicandris/ha-blueprints/blob/main/automation/ups_battery_test.yaml
  input:
    entities:
      name: Entities
      input:
        plug:
          name: Mains plug
          description: Smart plug feeding the UPS mains input.
          selector:
            entity:
              domain: switch
        online:
          name: UPS online
          description: >-
            Either a binary sensor that is `on` while the UPS runs on mains, or a
            status sensor such as NUT's status data (`OL` = mains, `OB` = battery)
            or status (`Online` / `On Battery`).
          selector:
            entity:
              domain: [binary_sensor, sensor]
        battery:
          name: UPS battery (%)
          selector:
            entity:
              domain: sensor
              device_class: battery
        load:
          name: UPS load (%)
          selector:
            entity:
              domain: sensor
        runtime:
          name: UPS runtime left
          description: Seconds (as NUT reports it), minutes or hours, read from the sensor's unit.
          selector:
            entity:
              domain: sensor
    schedule:
      name: Schedule
      input:
        weekday:
          name: Weekday
          description: The test runs on the first of this weekday each month.
          default: '6'
          selector:
            select:
              options:
              - {label: Monday, value: '0'}
              - {label: Tuesday, value: '1'}
              - {label: Wednesday, value: '2'}
              - {label: Thursday, value: '3'}
              - {label: Friday, value: '4'}
              - {label: Saturday, value: '5'}
              - {label: Sunday, value: '6'}
        test_time:
          name: Test time
          description: Also the time of the day-before heads-up.
          default: '13:00:00'
          selector:
            time: {}
        warn_before:
          name: Warning before test
          description: >-
            Same-day reminder this long before the test (may cross midnight).
            Under a minute means no reminder.
          default: {hours: 0, minutes: 30, seconds: 0}
          selector:
            duration: {}
    limits:
      name: Limits
      input:
        test_minutes:
          name: Test length
          default: 15
          selector:
            number: {min: 1, max: 120, unit_of_measurement: min}
        min_battery:
          name: Minimum battery to start
          default: 80
          selector:
            number: {min: 10, max: 100, unit_of_measurement: '%'}
        abort_battery:
          name: Abort below battery
          description: Must be under the minimum to start.
          default: 40
          selector:
            number: {min: 5, max: 95, unit_of_measurement: '%'}
        battery_wait:
          name: Wait for battery
          description: >-
            How long the UPS gets to report it is on battery after the cut. Keep it
            well above the UPS integration's poll interval (NUT polls every 60 s).
          default: 180
          selector:
            number: {min: 30, max: 900, unit_of_measurement: s}
        failsafe_minutes:
          name: Failsafe
          description: >-
            Turn the plug back on if it has been off this long with no test running.
            Must be longer than the test plus the battery wait and a minute.
          default: 30
          selector:
            number: {min: 5, max: 240, unit_of_measurement: min}
    notify:
      name: Notify action
      description: >-
        Runs for every heads-up and outcome, with variables `title`, `message` and
        `important` (true for aborts, cut-short tests and the failsafe). E.g.
        notify.mobile_app_x with `title: "{{ title }}"` and `message: "{{ message }}"`.
      default: []
      selector:
        action: {}

triggers:
- trigger: time
  at: !input test_time
  id: run
# True from the warning moment until the next test time; under a minute never
# fires (now() templates re-render once a minute), so it can't collide with `run`.
- trigger: template
  value_template: >-
    {% set lead = timedelta(**warn_before) %}
    {% set t = today_at(test_time) %}
    {% set t = t if now() < t else t + timedelta(days=1) %}
    {{ lead.total_seconds() >= 60 and now() >= t - lead }}
  id: warn
- trigger: homeassistant
  event: start
  id: failsafe
- trigger: event
  event_type: automation_reloaded
  id: failsafe
- trigger: state
  entity_id: !input plug
  to: 'off'
  for:
    minutes: !input failsafe_minutes
  id: stuck

trigger_variables:
  test_time: !input test_time
  warn_before: !input warn_before

variables:
  plug: !input plug
  online: !input online
  battery: !input battery
  load: !input load
  runtime: !input runtime
  weekday: !input weekday
  test_minutes: !input test_minutes
  min_battery: !input min_battery
  abort_battery: !input abort_battery
  battery_wait: !input battery_wait
  failsafe_minutes: !input failsafe_minutes
  nid: "{{ this.entity_id | replace('.', '_') }}"

actions:
- choose:
  - conditions:
    - condition: trigger
      id: failsafe
    sequence:
    # At HA start the plug may not be loaded yet, and turning on an unavailable
    # switch is a silent no-op.
    - wait_template: "{{ states(plug) not in ['unavailable', 'unknown'] }}"
      timeout: 300
    - condition: template
      value_template: "{{ not is_state(plug, 'on') }}"
      alias: Plug was left off
    - &restore_mains
      alias: Restore mains, retried
      repeat:
        sequence:
        - action: switch.turn_on
          target:
            entity_id: '{{ plug }}'
          continue_on_error: true
        - wait_template: "{{ is_state(plug, 'on') }}"
          timeout: 10
        until: "{{ is_state(plug, 'on') or repeat.index >= 3 }}"
    - variables:
        title: >-
          ⚠️ UPS battery test — {{ 'mains restored' if is_state(plug, 'on') else 'MAINS NOT RESTORED' }}
        message: >-
          {{ plug }} was off after an HA restart or automation reload, so a test was
          probably cut short. {{ 'Mains restored automatically.' if is_state(plug, 'on')
          else 'It could not be switched on (' ~ states(plug) ~ ') — restore it by hand now.' }}
        important: true
    - action: persistent_notification.create
      data: {notification_id: '{{ nid }}', title: '{{ title }}', message: '{{ message }}'}
    - sequence: !input notify
  - conditions:
    - condition: trigger
      id: stuck
    sequence:
    - *restore_mains
    - variables:
        title: >-
          ⚠️ UPS battery test — {{ 'never finished' if is_state(plug, 'on') else 'MAINS NOT RESTORED' }}
        message: >-
          {{ plug }} had been off for {{ failsafe_minutes }} min with no test running.
          {{ 'Mains restored automatically. Check the trace.' if is_state(plug, 'on')
          else 'It could not be switched on (' ~ states(plug) ~ ') — restore it by hand now.' }}
        important: true
    - action: persistent_notification.create
      data: {notification_id: '{{ nid }}', title: '{{ title }}', message: '{{ message }}'}
    - sequence: !input notify
  - conditions:
    - condition: trigger
      id: run
    - condition: template
      value_template: '{% set t = now() + timedelta(days=1) %}{{ t.weekday() == weekday
        | int and t.day <= 7 }}'
    sequence:
    - &readings
      variables:
        batt_now: "{{ states(battery) | float | round(0) | int ~ '%' if is_number(states(battery)) else 'unknown' }}"
        load_now: "{{ states(load) | float | round(0) | int ~ '%' if is_number(states(load)) else 'unknown' }}"
        runtime_now: >-
          {%- set r = states(runtime) %}
          {%- if is_number(r) %}
          {%- set per_min = {'s': 60, 'min': 1, 'h': 1 / 60, 'd': 1 / 1440}
              .get(state_attr(runtime, 'unit_of_measurement'), 60) %}
          {{- (r | float / per_min) | round(0) | int }} min
          {%- else %}unknown{% endif %}
    - variables:
        title: 🗓️ UPS battery test tomorrow
        message: 'Heads-up: UPS battery test tomorrow at {{ test_time[:5] }}. Mains
          cut for up to {{ test_minutes }} min. Battery {{ batt_now }}, needs
          {{ min_battery }}% to run.'
        important: false
    - sequence: !input notify
  - conditions:
    - condition: trigger
      id: warn
    - condition: template
      alias: The upcoming test time is a test day
      value_template: >-
        {% set t = today_at(test_time) %}
        {% set t = t if now() < t else t + timedelta(days=1) %}
        {{ t.weekday() == weekday | int and t.day <= 7 }}
    sequence:
    - *readings
    - variables:
        title: ⏳ UPS battery test soon
        message: 'UPS battery test at {{ test_time[:5] }}. Battery {{ batt_now }},
          load {{ load_now }}.'
        important: false
    - sequence: !input notify
  default:
  - if:
    - condition: template
      value_template: '{{ trigger.id is defined and not (now().weekday() == weekday
        | int and now().day <= 7) }}'
    then:
    - stop: Not the test day
  - if:
    - condition: template
      value_template: >-
        {{ abort_battery >= min_battery
           or failsafe_minutes * 60 <= test_minutes * 60 + battery_wait + 60 }}
    then:
    - variables:
        title: ⚠️ UPS battery test — not run, check the settings
        message: >-
          {{ 'Abort battery (' ~ abort_battery ~ '%) must be under the minimum to start ('
             ~ min_battery ~ '%). ' if abort_battery >= min_battery else '' }}{{ 'Failsafe ('
             ~ failsafe_minutes ~ ' min) must be longer than the test (' ~ test_minutes
             ~ ' min) plus the battery wait (' ~ battery_wait ~ ' s) and a minute.'
             if failsafe_minutes * 60 <= test_minutes * 60 + battery_wait + 60 else '' }}
        important: true
    - action: persistent_notification.create
      data: {notification_id: '{{ nid }}', title: '{{ title }}', message: '{{ message }}'}
    - sequence: !input notify
    - stop: Invalid settings
  - *readings
  - if:
    - condition: template
      value_template: >-
        {{ not is_state(plug, 'on') or not (is_state(online, 'on')
           if online.startswith('binary_sensor.')
           else ('OL' in states(online).split() or 'Online' in states(online))) }}
    then:
    - variables:
        title: 🔌 UPS battery test — skipped
        message: >-
          The UPS is not on mains right now ({{ plug }} {{ states(plug) }}, {{ online }}
          {{ states(online) }}), so the test would drain a battery that is already in use.
        important: true
    - action: persistent_notification.create
      data: {notification_id: '{{ nid }}', title: '{{ title }}', message: '{{ message }}'}
    - sequence: !input notify
    - stop: UPS not on mains
  - if:
    - condition: template
      value_template: '{{ states(battery) | int(0) < min_battery }}'
    then:
    - variables:
        title: 🔋 UPS battery test — skipped
        message: 'UPS battery is {{ batt_now }}, under {{ min_battery }}%.'
        important: false
    - action: persistent_notification.create
      data: {notification_id: '{{ nid }}', title: '{{ title }}', message: '{{ message }}'}
    - sequence: !input notify
    - stop: Battery too low to test
  - variables:
      title: ▶️ UPS battery test — running
      message: 'Mains cut for up to {{ test_minutes }} min. Battery {{ batt_now }},
        load {{ load_now }}, {{ runtime_now }} runtime.'
      important: false
      batt_start: '{{ states(battery) | int(0) }}'
  - action: persistent_notification.create
    data: {notification_id: '{{ nid }}', title: '{{ title }}', message: '{{ message }}'}
  - sequence: !input notify
  - action: switch.turn_off
    target:
      entity_id: '{{ plug }}'
  - wait_template: >-
      {{ is_state(online, 'off') if online.startswith('binary_sensor.')
         else ('OB' in states(online).split() or 'On Battery' in states(online)) }}
    timeout: '{{ battery_wait }}'
  - if:
    - condition: template
      value_template: '{{ not wait.completed }}'
    then:
    - *restore_mains
    - variables:
        title: ⚠️ UPS battery test — ABORTED
        message: >-
          {{ plug }} switched off but the UPS never reported running on battery within
          {{ battery_wait }} s. Wrong plug? {{ 'Power restored.' if is_state(plug, 'on')
          else 'Plug could not be switched back on — restore it by hand now.' }}
        important: true
    - action: persistent_notification.create
      data: {notification_id: '{{ nid }}', title: '{{ title }}', message: '{{ message }}'}
    - sequence: !input notify
    - stop: Plug does not feed the UPS mains
  # A lost battery reading aborts too: assuming a value would disable the floor.
  - wait_template: >-
      {{ not is_number(states(battery)) or states(battery) | float < abort_battery
         or is_state(plug, 'on') }}
    timeout: '{{ test_minutes * 60 }}'
  - variables:
      stopped: "{{ is_state(plug, 'on') }}"
      lost: '{{ not is_number(states(battery)) }}'
      cut_short: '{{ wait.completed and not stopped }}'
      held: '{{ ((test_minutes * 60 - (wait.remaining | float(0))) / 60) | round(1) }}'
  - *restore_mains
  # Stay running until the UPS confirms mains, so a plug that fails to switch back
  # on is reported, and other automations can tell the recovery was this test.
  - wait_template: >-
      {{ is_state(online, 'on') if online.startswith('binary_sensor.')
         else ('OL' in states(online).split() or 'Online' in states(online)) }}
    timeout: 300
  - variables:
      mains_back: '{{ wait.completed }}'
  - *readings
  - variables:
      title: >-
        {{ '⚠️' if cut_short or not mains_back else '✅' }} UPS battery test — {{
        'MAINS NOT BACK' if not mains_back else ('stopped' if stopped else ('CUT SHORT'
        if cut_short else 'passed')) }}
      message: >-
        Held {{ held }} min on battery, {{ batt_start }}% → {{ batt_now }}{{
        ' — stopped by hand' if stopped else ((', cut short: battery reading lost' if lost
        else ', cut short at the ' ~ abort_battery ~ '% floor') if cut_short else '') }}. {{
        'Mains restored.' if mains_back else 'Plug switched on but the UPS still reports
        no mains after 5 min — check it now.' }} Load {{ load_now }}, {{ runtime_now }} runtime.
      important: '{{ cut_short or not mains_back }}'
  - action: persistent_notification.create
    data: {notification_id: '{{ nid }}', title: '{{ title }}', message: '{{ message }}'}
  - sequence: !input notify

mode: single
